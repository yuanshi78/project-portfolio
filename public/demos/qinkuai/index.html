<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6f3">
  <title>秦快差旅 · 静态演示</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202b29;
      --muted: #77817c;
      --line: #e7ebe7;
      --paper: #fff;
      --canvas: #f4f6f3;
      --green: #276b58;
      --green-soft: #e8f2ed;
      --amber: #ae7130;
      --amber-soft: #fbf1e2;
      --red: #b95148;
      --red-soft: #f9eae8;
      --blue: #47758b;
      --blue-soft: #eaf1f4;
      --shadow: 0 8px 30px rgb(34 47 41 / 5%);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font: 14px/1.5 "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    .app { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 3;
      display: flex;
      width: 238px;
      flex-direction: column;
      padding: 25px 16px 18px;
      background: #20342f;
      color: #e8efeb;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 9px 30px; }
    .brand-mark {
      display: grid;
      width: 35px;
      height: 35px;
      place-items: center;
      border-radius: 10px;
      background: #d6a666;
      color: #20342f;
      font-family: Georgia, serif;
      font-size: 19px;
      font-weight: 700;
    }
    .brand-name { font-family: Georgia, "PingFang SC", serif; font-size: 17px; letter-spacing: .3px; }
    .brand-caption { margin-top: 1px; color: #9eafa8; font-size: 10px; letter-spacing: 1.2px; }
    .nav-label { padding: 0 10px 9px; color: #91a49b; font-size: 10px; letter-spacing: 1.3px; }
    .nav { display: grid; gap: 5px; }
    .nav button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #bdcbc4;
      cursor: pointer;
      text-align: left;
      transition: background .18s ease, color .18s ease;
    }
    .nav button:hover { background: rgb(255 255 255 / 7%); color: #fff; }
    .nav button.active { background: #31594c; color: #fff; }
    .nav-symbol { width: 18px; color: #a6c8b8; font-size: 15px; text-align: center; }
    .nav-count { margin-left: auto; color: #edc98d; font-size: 11px; }
    .sidebar-bottom { margin-top: auto; }
    .demo-note { margin: 0 2px 16px; padding: 13px; border: 1px solid rgb(255 255 255 / 13%); border-radius: 7px; color: #bdcbc4; font-size: 11px; }
    .demo-note strong { display: block; margin-bottom: 4px; color: #f0d19d; font-size: 12px; }
    .profile { display: flex; align-items: center; gap: 10px; padding: 13px 7px 0; border-top: 1px solid rgb(255 255 255 / 13%); }
    .avatar { display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: #dce8df; color: #31594c; font-weight: 700; }
    .profile-name { font-size: 12px; }
    .profile-role { color: #9eafa8; font-size: 10px; }
    .main { min-height: 100vh; margin-left: 238px; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 38px;
      border-bottom: 1px solid var(--line);
      background: rgb(255 255 255 / 94%);
      backdrop-filter: blur(12px);
    }
    .crumb { color: var(--muted); font-size: 12px; }
    .crumb strong { color: var(--ink); font-weight: 600; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .search {
      width: 205px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: 0;
      background: #fafbf9;
      color: var(--ink);
    }
    .search:focus, input:focus, select:focus, textarea:focus { border-color: #76a391; box-shadow: 0 0 0 3px rgb(39 107 88 / 9%); }
    .search::placeholder { color: #a2aaa5; }
    .icon-button { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 6px; background: white; cursor: pointer; }
    .icon-button:hover { background: #f5f8f5; }
    .content { width: min(1440px, 100%); margin: 0 auto; padding: 31px 38px 48px; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 23px; }
    .eyebrow { margin-bottom: 7px; color: var(--green); font-size: 10px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "PingFang SC", serif; font-size: 27px; font-weight: 500; line-height: 1.2; }
    .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
    .primary-button, .secondary-button { display: inline-flex; min-height: 38px; align-items: center; justify-content: center; gap: 7px; padding: 0 14px; border: 1px solid transparent; border-radius: 6px; cursor: pointer; transition: transform .16s ease, background .16s ease; }
    .primary-button { background: var(--green); color: white; }
    .primary-button:hover { transform: translateY(-1px); background: #1f5948; }
    .secondary-button { border-color: var(--line); background: white; color: #47534e; }
    .secondary-button:hover { background: #f8faf8; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin-bottom: 17px; }
    .metric { min-height: 117px; padding: 17px 18px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); box-shadow: var(--shadow); }
    .metric-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 11px; }
    .metric-icon { display: grid; width: 29px; height: 29px; place-items: center; border-radius: 7px; background: var(--green-soft); color: var(--green); font-size: 12px; font-weight: 700; }
    .metric:nth-child(2) .metric-icon { background: var(--amber-soft); color: var(--amber); }
    .metric:nth-child(3) .metric-icon { background: var(--blue-soft); color: var(--blue); }
    .metric:nth-child(4) .metric-icon { background: var(--red-soft); color: var(--red); }
    .metric-value { margin-top: 7px; font-family: Georgia, serif; font-size: 28px; line-height: 1.1; }
    .metric-foot { margin-top: 5px; color: #8b958f; font-size: 10px; }
    .metric-foot b { color: var(--green); font-weight: 600; }
    .overview-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(265px, .9fr); gap: 16px; margin-bottom: 17px; }
    .panel { border: 1px solid var(--line); border-radius: 7px; background: var(--paper); box-shadow: var(--shadow); }
    .panel-head { display: flex; min-height: 55px; align-items: center; justify-content: space-between; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--line); }
    .panel-title { margin: 0; font-size: 13px; font-weight: 650; }
    .panel-meta { color: var(--muted); font-size: 10px; }
    .trend-panel { padding-bottom: 8px; }
    .chart { display: flex; height: 178px; align-items: stretch; gap: 14px; padding: 17px 20px 0; }
    .chart-column { display: flex; min-width: 0; flex: 1; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; }
    .bar-pair { display: flex; width: min(39px, 90%); height: 133px; align-items: flex-end; justify-content: center; gap: 4px; border-bottom: 1px solid #e8ece8; }
    .bar { width: 13px; min-height: 5px; border-radius: 3px 3px 0 0; background: #8bb6a2; animation: rise .55s ease both; transform-origin: bottom; }
    .bar.secondary { background: #e7c995; }
    .chart-label { color: #929c96; font-size: 9px; }
    .legend { display: flex; gap: 15px; padding: 12px 20px 0; color: var(--muted); font-size: 10px; }
    .legend i { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 2px; background: #8bb6a2; }
    .legend span + span i { background: #e7c995; }
    .approvals { padding-bottom: 5px; }
    .approval-item { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid #f0f2ef; }
    .approval-item:last-child { border-bottom: 0; }
    .approval-initial { display: grid; width: 32px; height: 32px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: #f4eadc; color: #987044; font-size: 11px; font-weight: 700; }
    .approval-copy { min-width: 0; flex: 1; }
    .approval-copy strong { display: block; overflow: hidden; font-size: 11px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .approval-copy small { color: var(--muted); font-size: 10px; }
    .approve-button { padding: 5px 8px; border: 1px solid #d6e4da; border-radius: 5px; background: #f7fbf7; color: var(--green); cursor: pointer; font-size: 10px; }
    .approve-button:hover { background: var(--green-soft); }
    .table-panel { overflow: hidden; }
    .table-tools { display: flex; align-items: center; gap: 8px; }
    .filter-select { min-height: 32px; padding: 0 9px; border: 1px solid var(--line); border-radius: 5px; background: white; color: #66716b; font-size: 10px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
    th { padding: 11px 17px; background: #fafbf9; color: #8b958f; font-size: 10px; font-weight: 500; }
    td { padding: 13px 17px; border-top: 1px solid #eff1ee; color: #4e5953; font-size: 11px; }
    tbody tr:hover { background: #fbfcfa; }
    .trip-title { color: var(--ink); font-weight: 600; }
    .trip-id { display: block; margin-top: 2px; color: #99a29d; font-size: 9px; }
    .status { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 20px; font-size: 9px; }
    .status::before { width: 5px; height: 5px; border-radius: 50%; background: currentColor; content: ""; }
    .status-approved { background: var(--green-soft); color: var(--green); }
    .status-pending { background: var(--amber-soft); color: var(--amber); }
    .status-rejected { background: var(--red-soft); color: var(--red); }
    .status-completed { background: var(--blue-soft); color: var(--blue); }
    .text-button { padding: 3px 5px; border: 0; background: transparent; color: var(--green); cursor: pointer; font-size: 10px; }
    .text-button:hover { text-decoration: underline; }
    .empty { padding: 45px 16px; color: var(--muted); text-align: center; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; padding: 18px; background: rgb(22 34 29 / 48%); }
    .modal-backdrop.open { display: grid; animation: fade-in .15s ease both; }
    .modal { width: min(520px, 100%); max-height: min(90vh, 720px); overflow-y: auto; border-radius: 9px; background: white; box-shadow: 0 20px 70px rgb(0 0 0 / 18%); animation: lift-in .2s ease both; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 19px 22px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-family: Georgia, "PingFang SC", serif; font-size: 19px; font-weight: 500; }
    .close-button { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 5px; background: white; cursor: pointer; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 20px 22px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #5e6963; font-size: 11px; }
    .field input, .field select, .field textarea { width: 100%; min-height: 38px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 5px; outline: 0; background: white; }
    .field textarea { min-height: 72px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 19px; border-top: 1px solid var(--line); }
    .toast { position: fixed; right: 25px; bottom: 24px; z-index: 8; padding: 12px 16px; border-radius: 6px; background: #20342f; box-shadow: var(--shadow); color: white; opacity: 0; pointer-events: none; transform: translateY(8px); transition: .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @keyframes rise { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes lift-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 1000px) {
      .sidebar { width: 205px; }
      .main { margin-left: 205px; }
      .content { padding-right: 24px; padding-left: 24px; }
      .topbar { padding: 0 24px; }
      .overview-grid { grid-template-columns: minmax(0, 1.3fr) minmax(250px, .9fr); }
    }
    @media (max-width: 760px) {
      .sidebar { position: static; width: auto; height: auto; padding: 12px 15px; }
      .brand { padding: 0; }
      .brand-mark { width: 31px; height: 31px; }
      .brand-name { font-size: 15px; }
      .brand-caption, .nav-label, .sidebar-bottom { display: none; }
      .nav { display: flex; overflow-x: auto; gap: 4px; margin-top: 12px; scrollbar-width: none; }
      .nav button { width: auto; flex: 0 0 auto; gap: 6px; padding: 8px 10px; font-size: 11px; }
      .nav-symbol { width: auto; }
      .nav-count { display: none; }
      .main { margin-left: 0; }
      .topbar { position: static; min-height: 57px; padding: 0 16px; }
      .top-actions { gap: 7px; }
      .search { width: min(36vw, 165px); padding: 8px; font-size: 11px; }
      .icon-button { display: none; }
      .content { padding: 23px 16px 35px; }
      .page-heading { align-items: flex-start; }
      h1 { font-size: 23px; }
      .page-heading .primary-button { min-height: 35px; padding: 0 10px; font-size: 11px; white-space: nowrap; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .metric { min-height: 105px; padding: 13px; }
      .metric-value { font-size: 25px; }
      .overview-grid { grid-template-columns: 1fr; }
      .chart { height: 162px; gap: 6px; padding-right: 11px; padding-left: 11px; }
      .bar-pair { height: 120px; }
      .table-panel .panel-head { align-items: flex-start; flex-direction: column; padding-top: 13px; padding-bottom: 12px; }
      .table-tools { width: 100%; }
      .filter-select { flex: 1; }
      th, td { padding-right: 12px; padding-left: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">秦</div>
        <div><div class="brand-name">秦快差旅</div><div class="brand-caption">TRAVEL MANAGEMENT</div></div>
      </div>
      <div class="nav-label">工作台</div>
      <nav class="nav" aria-label="主导航">

        <div class="profile"><div class="avatar">林</div><div><div class="profile-name">林晓 · 管理员</div><div class="profile-role">秦快互联 · 管理后台</div></div></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="crumb">秦快差旅 <span aria-hidden="true">/</span> <strong id="crumb-title">差旅总览</strong></div>
        <div class="top-actions">
          <input class="search" id="search" type="search" placeholder="搜索员工、城市或单号" aria-label="搜索员工、城市或单号">
          <button class="icon-button" id="help-button" aria-label="演示说明" title="演示说明">?</button>
          <div class="avatar" aria-label="林晓">林</div>

      <section class="content" id="content" aria-live="polite"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" role="presentation">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <form id="application-form">
        <div class="modal-head"><h2 id="modal-title">新建差旅申请</h2><button class="close-button" type="button" data-close aria-label="关闭">×</button></div>
        <div class="form-grid">
          <div class="field"><label for="employee">出行员工</label><input id="employee" name="employee" value="林晓" required></div>
          <div class="field"><label for="department">所属部门</label><select id="department" name="department"><option>产品研发部</option><option>市场运营部</option><option>综合管理部</option><option>客户服务部</option></select></div>
          <div class="field"><label for="destination">目的城市</label><input id="destination" name="destination" placeholder="例如：上海" required></div>
          <div class="field"><label for="dates">出行日期</label><input id="dates" name="dates" type="text" placeholder="10月20日 - 10月22日" required></div>
          <div class="field full"><label for="purpose">出行事由</label><textarea id="purpose" name="purpose" placeholder="填写客户拜访、会议或其他出行安排" required></textarea></div>
        </div>
        <div class="modal-actions"><button class="secondary-button" type="button" data-close>取消</button><button class="primary-button" type="submit">提交审批</button></div>
      </form>
    </section>
  </div>
  <div class="toast" id="toast" role="status"></div>

    const pages = {

      flights: { title: '机票订单', eyebrow: 'FLIGHT ORDERS', subtitle: '团队航班订单与出票状态。', type: 'flight' },
      hotels: { title: '酒店订单', eyebrow: 'HOTEL BOOKINGS', subtitle: '团队住宿预订与入住安排。', type: 'hotel' },
      reports: { title: '差旅报告', eyebrow: 'TRAVEL REPORTS', subtitle: '按月查看出行费用与订单概况。', type: 'application' },
    };
    let currentView = 'overview';
    let statusFilter = '全部状态';
    let toastTimer;

    const content = document.querySelector('#content');
    const search = document.querySelector('#search');
    const statusClass = status => ({ '审批中': 'pending', '待审批': 'pending', '已通过': 'approved', '已完成': 'completed', '已出票': 'approved', '已确认': 'approved', '已退票': 'rejected' }[status] || 'pending');
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);

    function visibleRecords(type) {
      const term = search.value.trim().toLowerCase();
      return records.filter(item => item.type === type)
        .filter(item => statusFilter === '全部状态' || item.status === statusFilter)
        .filter(item => !term || [item.id, item.title, item.employee, item.department, item.destination].some(value => value.toLowerCase().includes(term)));
    }

    function tableMarkup(list) {
      if (!list.length) return '<div class="empty">没有找到符合条件的记录</div>';
      return `<div class="table-wrap"><table><thead><tr><th>申请事项</th><th>出行员工</th><th>目的地 / 日期</th><th>预算金额</th><th>状态</th><th>操作</th></tr></thead><tbody>${list.map(item => `<tr>
        <td><span class="trip-title">${escapeHtml(item.title)}</span><span class="trip-id">${escapeHtml(item.id)}</span></td>
        <td>${escapeHtml(item.employee)}<span class="trip-id">${escapeHtml(item.department)}</span></td>
        <td>${escapeHtml(item.destination)}<span class="trip-id">${escapeHtml(item.dates)}</span></td>
        <td>${escapeHtml(item.amount)}</td>
        <td><span class="status status-${statusClass(item.status)}">${escapeHtml(item.status)}</span></td>
        <td><button class="text-button" data-record="${escapeHtml(item.id)}">查看详情</button></td>
      </tr>`).join('')}</tbody></table></div>`;
    }

    function render() {
      const page = pages[currentView];
      document.querySelector('#crumb-title').textContent = page.title;
      document.querySelectorAll('.nav button').forEach(button => button.classList.toggle('active', button.dataset.view === currentView));
      const pendingCount = records.filter(item => item.type === 'application' && (item.status === '审批中' || item.status === '待审批')).length;
      document.querySelector('#nav-pending').textContent = String(pendingCount).padStart(2, '0');
      const list = visibleRecords(page.type);
      const headingAction = currentView === 'applications' || currentView === 'overview'
        ? '<button class="primary-button" data-new>＋ 新建差旅申请</button>'
        : '<button class="secondary-button" data-export>导出报表</button>';

      if (currentView === 'overview') {
        content.innerHTML = `<div class="page-heading"><div><div class="eyebrow">${page.eyebrow}</div><h1>${page.title}</h1><p class="subtitle">${page.subtitle}</p></div>${headingAction}</div>
          <div class="metrics">
            <article class="metric"><div class="metric-top"><span>本月差旅申请</span><span class="metric-icon">申</span></div><div class="metric-value">28</div><div class="metric-foot"><b>+12%</b> 较上月</div></article>
            <article class="metric"><div class="metric-top"><span>待我审批</span><span class="metric-icon">审</span></div><div class="metric-value" id="pending-metric">3</div><div class="metric-foot">需要及时处理</div></article>
            <article class="metric"><div class="metric-top"><span>机票订单</span><span class="metric-icon">机</span></div><div class="metric-value">16</div><div class="metric-foot">本月已出票</div></article>
            <article class="metric"><div class="metric-top"><span>差旅总费用</span><span class="metric-icon">¥</span></div><div class="metric-value" style="font-size:25px">¥ 42,680</div><div class="metric-foot"><b>预算使用 68%</b></div></article>
          </div>
          <div class="overview-grid">
            <section class="panel trend-panel"><div class="panel-head"><h2 class="panel-title">差旅费用趋势</h2><span class="panel-meta">近 6 个月 · ¥</span></div><div class="chart" aria-label="近六个月差旅费用柱状图">
              ${[[64,35],[78,44],[56,51],[91,62],[72,48],[84,59]].map((pair, i) => `<div class="chart-column"><div class="bar-pair"><span class="bar" style="height:${pair[0]}%;animation-delay:${i * 45}ms"></span><span class="bar secondary" style="height:${pair[1]}%;animation-delay:${i * 45 + 35}ms"></span></div><span class="chart-label">${['5月','6月','7月','8月','9月','10月'][i]}</span></div>`).join('')}
            </div><div class="legend"><span><i></i>机票与住宿</span><span><i></i>其他费用</span></div></section>
            <section class="panel approvals"><div class="panel-head"><h2 class="panel-title">待处理审批</h2><span class="panel-meta" id="approval-count">3 项待办</span></div><div id="approval-list"></div></section>
          </div>
          <section class="panel table-panel"><div class="panel-head"><h2 class="panel-title">近期差旅申请</h2><div class="table-tools"><select class="filter-select" aria-label="按状态筛选">${['全部状态','审批中','待审批','已通过','已完成'].map(value => `<option ${statusFilter === value ? 'selected' : ''}>${value}</option>`).join('')}</select><button class="text-button" data-view-link="applications">查看全部 →</button></div></div><div id="records-table">${tableMarkup(list.slice(0, 5))}</div></section>`;
        renderApprovals();
      } else if (currentView === 'reports') {
        content.innerHTML = `<div class="page-heading"><div><div class="eyebrow">${page.eyebrow}</div><h1>${page.title}</h1><p class="subtitle">${page.subtitle}</p></div>${headingAction}</div><div class="metrics"><article class="metric"><div class="metric-top"><span>本月总费用</span><span class="metric-icon">¥</span></div><div class="metric-value" style="font-size:25px">¥ 42,680</div><div class="metric-foot">差旅预算使用率 <b>68%</b></div></article><article class="metric"><div class="metric-top"><span>人均费用</span><span class="metric-icon">均</span></div><div class="metric-value" style="font-size:25px">¥ 3,556</div><div class="metric-foot">本月 12 位出行员工</div></article><article class="metric"><div class="metric-top"><span>出行人次</span><span class="metric-icon">人</span></div><div class="metric-value">34</div><div class="metric-foot">覆盖 11 个城市</div></article><article class="metric"><div class="metric-top"><span>节省金额</span><span class="metric-icon">省</span></div><div class="metric-value" style="font-size:25px">¥ 8,240</div><div class="metric-foot"><b>较市场价节省 16%</b></div></article></div><div class="overview-grid"><section class="panel trend-panel"><div class="panel-head"><h2 class="panel-title">月度费用分析</h2><span class="panel-meta">2026 年</span></div><div class="chart" style="height:220px">${[[56,35],[66,42],[48,39],[77,51],[63,45],[83,53]].map((pair, i) => `<div class="chart-column"><div class="bar-pair" style="height:170px"><span class="bar" style="height:${pair[0]}%"></span><span class="bar secondary" style="height:${pair[1]}%"></span></div><span class="chart-label">${['5月','6月','7月','8月','9月','10月'][i]}</span></div>`).join('')}</div><div class="legend"><span><i></i>交通住宿</span><span><i></i>其他费用</span></div></section><section class="panel"><div class="panel-head"><h2 class="panel-title">费用构成</h2><span class="panel-meta">本月</span></div><div style="padding:18px"><div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:11px"><span>机票</span><b>¥ 21,340 · 50%</b></div><div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:11px"><span>酒店</span><b>¥ 14,120 · 33%</b></div><div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:11px"><span>其他交通</span><b>¥ 4,270 · 10%</b></div><div style="display:flex;justify-content:space-between;padding:11px 0;font-size:11px"><span>其他费用</span><b>¥ 2,950 · 7%</b></div></div></section></div><section class="panel table-panel"><div class="panel-head"><h2 class="panel-title">近期申请记录</h2><span class="panel-meta">共 ${list.length} 条</span></div><div id="records-table">${tableMarkup(list.slice(0, 5))}</div></section>`;
      } else {
        const tableTitle = currentView === 'flights' ? '团队机票订单' : currentView === 'hotels' ? '团队酒店订单' : '全部差旅申请';
        content.innerHTML = `<div class="page-heading"><div><div class="eyebrow">${page.eyebrow}</div><h1>${page.title}</h1><p class="subtitle">${page.subtitle}</p></div>${headingAction}</div><section class="panel table-panel"><div class="panel-head"><h2 class="panel-title">${tableTitle}</h2><div class="table-tools"><select class="filter-select" aria-label="按状态筛选">${['全部状态', ...new Set(records.filter(item => item.type === page.type).map(item => item.status))].map(value => `<option ${statusFilter === value ? 'selected' : ''}>${value}</option>`).join('')}</select><span class="panel-meta">${list.length} 条记录</span></div></div><div id="records-table">${tableMarkup(list)}</div></section>`;
      }
    }

    function renderApprovals() {
      const pending = records.filter(item => item.type === 'application' && (item.status === '审批中' || item.status === '待审批'));
      document.querySelector('#approval-count').textContent = `${pending.length} 项待办`;
      document.querySelector('#pending-metric').textContent = pending.length;
      document.querySelector('#approval-list').innerHTML = pending.length ? pending.slice(0, 3).map(item => `<div class="approval-item"><div class="approval-initial">${escapeHtml(item.employee.slice(0, 1))}</div><div class="approval-copy"><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(item.employee)} · ${escapeHtml(item.department)}</small></div><button class="approve-button" data-approve="${escapeHtml(item.id)}">审批</button></div>`).join('') : '<div class="empty">当前没有待处理审批</div>';
    }

    function showToast(message) {
      const toast = document.querySelector('#toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    function openModal() {
      const modal = document.querySelector('#modal-backdrop');
      modal.classList.add('open');
      modal.querySelector('input').focus();
    }
    function closeModal() { document.querySelector('#modal-backdrop').classList.remove('open'); }

    document.querySelector('.nav').addEventListener('click', event => {
      const button = event.target.closest('[data-view]');
      if (!button) return;
      currentView = button.dataset.view;
      statusFilter = '全部状态';
      render();
    });
    content.addEventListener('click', event => {
      const newButton = event.target.closest('[data-new]');
      const viewLink = event.target.closest('[data-view-link]');
      const approveButton = event.target.closest('[data-approve]');
      const recordButton = event.target.closest('[data-record]');
      if (newButton) openModal();
      if (viewLink) { currentView = viewLink.dataset.viewLink; statusFilter = '全部状态'; render(); }
      if (approveButton) {
        const item = records.find(record => record.id === approveButton.dataset.approve);
        if (item) item.status = '已通过';
        render();
        showToast('已通过该差旅申请（仅本地演示）');
      }
      if (recordButton) {
        const item = records.find(record => record.id === recordButton.dataset.record);
        if (item) showToast(`${item.title} · ${item.purpose}`);
      }
      if (event.target.closest('[data-export]')) showToast('报表已准备就绪（静态演示）');
    });
    content.addEventListener('change', event => {
      if (event.target.matches('.filter-select')) { statusFilter = event.target.value; render(); }
    });
    search.addEventListener('input', render);
    document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', closeModal));
    document.querySelector('#modal-backdrop').addEventListener('click', event => { if (event.target.id === 'modal-backdrop') closeModal(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
    document.querySelector('#help-button').addEventListener('click', () => showToast('演示数据仅保存在当前页面，刷新后恢复初始状态。'));
    document.querySelector('#application-form').addEventListener('submit', event => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const employee = String(form.get('employee')).trim();
      const destination = String(form.get('destination')).trim();
      const dates = String(form.get('dates')).trim();
      const purpose = String(form.get('purpose')).trim();
      records.unshift({
        id: `TMC-2026-${String(187 + records.filter(item => item.type === 'application').length - 6).padStart(4, '0')}`,
        title: `${destination}出差申请`, employee, department: String(form.get('department')), destination, dates,
        amount: '待预算', status: '待审批', type: 'application', purpose,
      });
      closeModal();
      event.currentTarget.reset();
      currentView = 'applications';
      statusFilter = '全部状态';
      search.value = '';
      render();
      showToast('申请已加入演示列表（仅本地演示）');
    });

    render();
  </script>
</body>
</html>
